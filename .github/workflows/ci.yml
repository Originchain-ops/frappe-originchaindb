name: Compatibility toolkit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build ruff
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build

  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          git clone --quiet --depth 1 --branch v16.54.0 https://github.com/frappe/frappe.git ../frappe-audit
          git clone --quiet --depth 1 --branch v16.53.0 https://github.com/frappe/erpnext.git ../erpnext-audit
          python -m frappe_originchaindb_compat audit --frappe ../frappe-audit --erpnext ../erpnext-audit --output audit.json
          diff evidence/source-audit.json audit.json

  reference-postgres:
    name: Harness verification on PostgreSQL 18 (not OriginChainDB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: probe
          POSTGRES_PASSWORD: reference-only
          POSTGRES_DB: probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U probe -d probe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OC_TEST_PGHOST: 127.0.0.1
      OC_TEST_PGPORT: '5432'
      OC_TEST_PGDATABASE: probe
      OC_TEST_PGUSER: probe
      OC_TEST_PGPASSWORD: reference-only
      OC_TEST_PGSSLMODE: disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[live]"
      - run: frappe-originchaindb-compat probe --reference-postgres --allow-scratch-writes --output reference-report.json
      - name: Verify scratch tables were removed
        run: |
          python - <<'PY'
          import psycopg2
          from frappe_originchaindb_compat.config import TestConfig
          import os
          config = TestConfig.from_environment(os.environ, reference_postgres=True)
          with psycopg2.connect(**config.connection_kwargs()) as conn:
              with conn.cursor() as cursor:
                  cursor.execute("SELECT COUNT(*) FROM information_schema.tables WHERE table_name LIKE 'tabOC Probe %'")
                  assert cursor.fetchone()[0] == 0, "Scratch tables remain after probes"
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reference-postgresql-only
          path: reference-report.json
          if-no-files-found: error

